    let map;
    let markersGroup;
    let referenceMarker = null;
    let userMarker = null;
    let userLocation = null;
    let currentDistances = {};

    const ESRI_TILE_URL = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}';
    const ESRI_ATTRIBUTION = 'Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA';

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([-7.323615428, 110.1928201], 13);
      L.tileLayer(ESRI_TILE_URL, { maxZoom: 19, attribution: ESRI_ATTRIBUTION }).addTo(map);
      markersGroup = L.layerGroup().addTo(map);

      renderMapAndList();

      setTimeout(() => { map.invalidateSize(); }, 500);
    }

    function createRedAmbulanceIcon() {
      return L.divIcon({
        className: 'custom-icon',
        html: `<div style="background-color: #ef4444; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3);"><i class="fa-solid fa-truck-medical text-sm"></i></div>`,
        iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -20]
      });
    }

    function createReferenceIcon() {
      return L.divIcon({
        className: 'ref-icon',
        html: `<div style="background-color: #2563eb; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 3px solid white; box-shadow: 0 0 12px rgba(37,99,235,0.8);"><i class="fa-solid fa-location-dot text-xs"></i></div>`,
        iconSize: [24, 24], iconAnchor: [12, 12]
      });
    }

    function createUserLocationIcon() {
      return L.divIcon({
        className: 'user-icon',
        html: `<div class="user-marker-pulse" style="background-color: #2563eb; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 3px solid white; box-shadow: 0 0 15px rgba(37,99,235,0.9);"><i class="fa-solid fa-user text-xs"></i></div>`,
        iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
      });
    }

    // FUNGSI DETEKSI LOKASI SAYA (GPS)
    function getUserLocation() {
      const gpsIcon = document.getElementById('gpsIcon');
      const gpsBtnText = document.getElementById('gpsBtnText');
      const statusMsg = document.getElementById('statusMsg');

      if (!navigator.geolocation) {
        alert("Perangkat atau browser Anda tidak mendukung fitur lokasi GPS.");
        return;
      }

      gpsIcon.className = "fa-solid fa-spinner fa-spin text-sm";
      gpsBtnText.innerText = "Mendeteksi Lokasi...";

      navigator.geolocation.getCurrentPosition(
        (position) => {
          gpsIcon.className = "fa-solid fa-location-arrow text-sm";
          gpsBtnText.innerText = "Lokasi Saya Terdeteksi";
          
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          userLocation = { lat: userLat, lng: userLng };

          // Reset dropdown kecamatan
          document.getElementById('districtSelect').value = "";

          // Hapus marker kecamatan jika ada
          if (referenceMarker) {
            map.removeLayer(referenceMarker);
            referenceMarker = null;
          }

          // Pasang/update marker lokasi pengguna
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([userLat, userLng], { icon: createUserLocationIcon() }).addTo(map);
          userMarker.bindPopup("<b>📍 Lokasi Anda Saat Ini</b>").openPopup();

          map.flyTo([userLat, userLng], 14, { duration: 1.2 });

          renderMapAndList();

          if (statusMsg) {
            statusMsg.innerText = "📍 Posko diurutkan dari lokasi GPS Anda.";
          }
        },
        (error) => {
          gpsIcon.className = "fa-solid fa-location-arrow text-sm";
          gpsBtnText.innerText = "Gunakan Lokasi Saya (GPS)";
          
          let errMsg = "Gagal mengambil lokasi GPS Anda.";
          if (error.code === error.PERMISSION_DENIED) {
            errMsg = "Izin lokasi ditolak. Silakan izinkan akses lokasi GPS di peramban Anda.";
          }
          alert(errMsg);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function renderMapAndList(selectedDistrict = "") {
      markersGroup.clearLayers();
      const listContainer = document.getElementById('ambulanceList');
      listContainer.innerHTML = '';

      let refLat = null;
      let refLng = null;
      let isUserLocMode = false;

      if (selectedDistrict && DISTRICT_COORDS[selectedDistrict]) {
        [refLat, refLng] = DISTRICT_COORDS[selectedDistrict];

        if (referenceMarker) map.removeLayer(referenceMarker);
        referenceMarker = L.marker([refLat, refLng], { icon: createReferenceIcon() }).addTo(map);
        referenceMarker.bindPopup(`<b>Pusat Acuan:</b> Kec. ${selectedDistrict}`).openPopup();

        ambulanceData.forEach((item, index) => {
          const lat = parseFloat(item.Latitude);
          const lng = parseFloat(item.Longitude);
          if (!isNaN(lat) && !isNaN(lng)) {
            currentDistances[index] = calculateDistance(refLat, refLng, lat, lng);
          } else {
            currentDistances[index] = 9999;
          }
        });
      } else if (userLocation) {
        isUserLocMode = true;
        refLat = userLocation.lat;
        refLng = userLocation.lng;

        if (referenceMarker) {
          map.removeLayer(referenceMarker);
          referenceMarker = null;
        }

        ambulanceData.forEach((item, index) => {
          const lat = parseFloat(item.Latitude);
          const lng = parseFloat(item.Longitude);
          if (!isNaN(lat) && !isNaN(lng)) {
            currentDistances[index] = calculateDistance(refLat, refLng, lat, lng);
          } else {
            currentDistances[index] = 9999;
          }
        });
      } else {
        if (referenceMarker) {
          map.removeLayer(referenceMarker);
          referenceMarker = null;
        }
        currentDistances = {};
      }

      let itemsToRender = ambulanceData.map((item, originalIndex) => ({
        ...item,
        originalIndex,
        distance: currentDistances[originalIndex] !== undefined ? currentDistances[originalIndex] : null
      }));

      if (selectedDistrict || isUserLocMode) {
        itemsToRender.sort((a, b) => a.distance - b.distance);
      }

      document.getElementById('unitCount').innerText = `${itemsToRender.length} Posko`;

      itemsToRender.forEach((item) => {
        const lat = parseFloat(item.Latitude);
        const lng = parseFloat(item.Longitude);

        if (isNaN(lat) || isNaN(lng)) return;

        let rawTel = item.No_Telepon ? item.No_Telepon.toString().replace(/[^0-9]/g, '') : '';
        if (rawTel && !rawTel.startsWith('0') && !rawTel.startsWith('62')) {
          rawTel = '0' + rawTel;
        }

        let rawWa = item.No_Whatsapp ? item.No_Whatsapp.toString().replace(/[^0-9]/g, '') : '';
        let waFormatted = '';
        if (rawWa) {
          waFormatted = rawWa.startsWith('0') ? '62' + rawWa.substring(1) : (rawWa.startsWith('62') ? rawWa : '62' + rawWa);
        }

        const marker = L.marker([lat, lng], { icon: createRedAmbulanceIcon() });
        const distLabel = isUserLocMode ? 'dari lokasi Anda' : 'dari pusat kec.';
        
        const popupContent = `
          <div class="p-1 min-w-[200px]">
            <h3 class="font-bold text-slate-800 text-sm mb-1">${item.Nama || '-'}</h3>
            <p class="text-xs text-slate-600 mb-2 leading-relaxed"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${item.Alamat || '-'}</p>
            ${item.distance !== null ? `<span class="inline-block bg-blue-50 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded mb-2">📍 ${item.distance.toFixed(1)} km${distLabel}</span>` : ''}
            <div class="flex space-x-1 pt-1 border-t border-slate-100 mt-2">
              ${rawTel ? `<a href="tel:${rawTel}" class="flex-1 bg-slate-800 text-white text-center py-1.5 rounded text-xs font-medium hover:bg-slate-700"><i class="fa-solid fa-phone mr-1"></i> Telepon</a>` : ''}
              ${waFormatted ? `<a href="https://wa.me/${waFormatted}" target="_blank" class="flex-1 bg-emerald-600 text-white text-center py-1.5 rounded text-xs font-medium hover:bg-emerald-500"><i class="fa-brands fa-whatsapp mr-1"></i> WA</a>` : ''}
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersGroup.addLayer(marker);

        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-bold text-slate-800 text-sm leading-snug">${item.Nama || '-'}</h4>
            ${item.distance !== null ? `<span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded-full whitespace-nowrap ml-2">📍 ${item.distance.toFixed(1)} km</span>` : ''}
          </div>
          <p class="text-xs text-slate-500 mb-2 line-clamp-2"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${item.Alamat || '-'}</p>
          
          <div class="text-xs text-slate-600 space-y-1 mb-3 bg-slate-50 p-2 rounded-lg">
            ${rawTel ? `<div class="flex items-center"><i class="fa-solid fa-phone text-slate-400 w-4"></i><span class="font-mono text-slate-700">${rawTel}</span></div>` : ''}
            ${rawWa ? `<div class="flex items-center"><i class="fa-brands fa-whatsapp text-emerald-500 w-4"></i><span class="font-mono text-slate-700">${rawWa.startsWith('0') ? rawWa : '0' + rawWa}</span></div>` : ''}
          </div>

          <div class="flex items-center justify-between pt-1 border-t border-slate-100">
            <button onclick="focusOnMap(${lat}, ${lng}, '${item.Nama}')" class="text-xs text-red-600 hover:text-red-700 font-medium flex items-center">
              <i class="fa-solid fa-crosshairs mr-1"></i> Fokus Peta
            </button>
            <div class="flex space-x-1">
              ${rawTel ? `<a href="tel:${rawTel}" class="w-8 h-8 rounded-full bg-slate-100 text-slate-700 hover:bg-slate-800 hover:text-white flex items-center justify-center transition" title="Telepon"><i class="fa-solid fa-phone text-xs"></i></a>` : ''}
              ${waFormatted ? `<a href="https://wa.me/${waFormatted}" target="_blank" class="w-8 h-8 rounded-full bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white flex items-center justify-center transition" title="WhatsApp"><i class="fa-brands fa-whatsapp text-sm"></i></a>` : ''}
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function handleDistrictChange() {
      const selected = document.getElementById('districtSelect').value;
      const statusMsg = document.getElementById('statusMsg');

      // Matikan mode lokasi GPS jika pengguna memilih kecamatan secara manual
      if (userMarker) {
        map.removeLayer(userMarker);
        userMarker = null;
        userLocation = null;
        document.getElementById('gpsBtnText').innerText = "Gunakan Lokasi Saya (GPS)";
      }

      if (selected && DISTRICT_COORDS[selected]) {
        const coords = DISTRICT_COORDS[selected];
        map.flyTo(coords, 13, { duration: 1.2 });
        statusMsg.innerText = `Menampilkan urutan terdekat dari Kec. ${selected}.`;
      } else {
        map.flyTo([-7.323615428, 110.1928201], 13, { duration: 1 });
        statusMsg.innerText = "Menampilkan seluruh unit Temanggung.";
      }

      renderMapAndList(selected);
    }

    function focusOnMap(lat, lng, title) {
      map.flyTo([lat, lng], 16, { duration: 1 });
      markersGroup.eachLayer(layer => {
        if (layer.getLatLng && layer.getLatLng().lat === lat && layer.getLatLng().lng === lng) {
          layer.openPopup();
        }
      });
    }

    async function fetchDataFromSheets() {
      const refreshIcon = document.getElementById('refreshIcon');
      const badgeDot = document.getElementById('sheetStatusDot');
      const badgeText = document.getElementById('sheetStatusText');
      const statusMsg = document.getElementById('statusMsg');

      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      try {
        const response = await fetch(GOOGLE_SHEETS_CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            
            if (results.data && results.data.length > 0) {
              const validData = results.data.filter(item => {
                const lat = parseFloat(item.Latitude);
                const lng = parseFloat(item.Longitude);
                return item.Nama && !isNaN(lat) && !isNaN(lng);
              });

              if (validData.length > 0) {
                ambulanceData = validData;
                renderMapAndList(document.getElementById('districtSelect').value);
                
                if (badgeDot) badgeDot.className = "w-2 h-2 mr-1.5 bg-emerald-500 rounded-full";
                if (badgeText) badgeText.innerText = "Google Sheets Terhubung";
                if (statusMsg) statusMsg.innerText = `Berhasil memuat ${validData.length} posko dari Google Sheets.`;
                return;
              }
            }
            throw new Error("Format CSV kosong.");
          }
        });

      } catch (err) {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
        console.warn("Sheets gagal, menggunakan data lokal:", err);
        
        if (badgeDot) badgeDot.className = "w-2 h-2 mr-1.5 bg-amber-500 rounded-full";
        if (badgeText) badgeText.innerText = "Data Lokal (Cadangan)";
        if (statusMsg) statusMsg.innerText = "Gagal memuat sheet, memakai data bawaan.";
        
        renderMapAndList(document.getElementById('districtSelect').value);
      }
    }

    window.onload = function() {
  initMap();
};
  </script>
